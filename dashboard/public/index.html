<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapFlag Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.2rem; font-weight: 700; color: #58a6ff; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #3fb950; display: inline-block; margin-left: auto; }
  #status-dot.offline { background: #f85149; }
  #status-label { font-size: 0.8rem; color: #8b949e; }
  #error-bar { display: none; background: #4a1a1a; border-bottom: 1px solid #f85149; padding: 8px 24px; font-size: 0.8rem; color: #f85149; }

  main { padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }

  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
  .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; color: #8b949e; margin-bottom: 14px; }

  /* 타이머 카드 */
  #timer-display { font-size: 2.8rem; font-weight: 700; color: #f0f6fc; letter-spacing: .02em; }
  #phase-badge { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
  .badge-capture { background: #1a4a2e; color: #3fb950; }
  .badge-prep    { background: #4a1a1a; color: #f85149; }
  .timer-sub { margin-top: 8px; font-size: 0.8rem; color: #8b949e; }

  /* 접속자 카드 */
  #player-list { list-style: none; }
  #player-list li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #21262d; font-size: 0.9rem; }
  #player-list li:last-child { border-bottom: none; }
  .player-team { font-size: 0.75rem; color: #8b949e; background: #21262d; padding: 2px 6px; border-radius: 4px; }
  .ping-good { color: #3fb950; }
  .ping-mid  { color: #d29922; }
  .ping-bad  { color: #f85149; }
  #no-players { color: #8b949e; font-size: 0.85rem; }

  /* 팀 카드 */
  #team-list { display: flex; flex-direction: column; gap: 8px; }
  .team-row { display: flex; align-items: center; gap: 10px; background: #21262d; border-radius: 6px; padding: 8px 12px; }
  .team-name { font-weight: 600; min-width: 60px; }
  .team-stat { font-size: 0.78rem; color: #8b949e; }
  .gold-val  { color: #d29922; font-size: 0.85rem; margin-left: auto; }

  /* 깃발 카드 */
  #flag-list { display: flex; flex-direction: column; gap: 6px; }
  .flag-row { background: #21262d; border-radius: 6px; padding: 8px 12px; }
  .flag-header { display: flex; justify-content: space-between; font-size: 0.85rem; }
  .flag-hp-bar { height: 4px; background: #30363d; border-radius: 2px; margin-top: 6px; }
  .flag-hp-fill { height: 100%; border-radius: 2px; transition: width .4s; }

  /* 제어판 */
  #controls { grid-column: 1 / -1; }
  .ctrl-row { display: flex; flex-wrap: wrap; gap: 10px; }
  button { background: #21262d; border: 1px solid #30363d; color: #e6edf3; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: background .15s; }
  button:hover { background: #30363d; }
  button.danger { border-color: #f85149; color: #f85149; }
  button.danger:hover { background: #4a1a1a; }
  button.success { border-color: #3fb950; color: #3fb950; }
  button.success:hover { background: #1a4a2e; }

  /* 점령 시간 조절 */
  .capture-input { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .capture-input label { font-size: 0.8rem; color: #8b949e; }
  .capture-input input { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 6px 10px; border-radius: 6px; width: 80px; font-size: 0.85rem; }

  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); align-items: center; justify-content: center; z-index: 100; }
  .confirm-overlay.show { display: flex; }
  .confirm-box { background: #161b22; border: 1px solid #f85149; border-radius: 10px; padding: 28px 32px; text-align: center; }
  .confirm-box h3 { color: #f85149; margin-bottom: 12px; }
  .confirm-box p  { color: #8b949e; font-size: 0.9rem; margin-bottom: 20px; }
  .confirm-box .btn-row { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>

<div id="error-bar"></div>
<header>
  <h1>⚑ TapFlag Dashboard</h1>
  <span id="refresh-label" style="font-size:.75rem;color:#8b949e"></span>
  <span id="status-dot"></span>
  <span id="status-label">연결 중...</span>
</header>

<main>
  <!-- 타이머 -->
  <div class="card">
    <h2>게임 타이머</h2>
    <div id="timer-display">--:--:--</div>
    <span id="phase-badge" class="badge-prep">대기 중</span>
    <div class="timer-sub">경과: <span id="elapsed">0초</span> / 남은: <span id="remaining">-</span></div>
  </div>

  <!-- 접속자 -->
  <div class="card">
    <h2>접속자 <span id="player-count" style="color:#58a6ff"></span></h2>
    <ul id="player-list"><li id="no-players">접속자 없음</li></ul>
  </div>

  <!-- 팀 -->
  <div class="card">
    <h2>팀 현황</h2>
    <div id="team-list"><span style="color:#8b949e;font-size:.85rem">팀 없음</span></div>
  </div>

  <!-- 깃발 -->
  <div class="card">
    <h2>깃발 HP</h2>
    <div id="flag-list"><span style="color:#8b949e;font-size:.85rem">깃발 없음</span></div>
  </div>

  <!-- 제어판 -->
  <div class="card" id="controls">
    <h2>제어판</h2>
    <div class="ctrl-row">
      <button class="success" onclick="setCapture(true)">점령 ON</button>
      <button onclick="setCapture(false)">점령 OFF</button>
      <button onclick="timerAction('start')">타이머 시작</button>
      <button onclick="timerAction('stop')">타이머 정지</button>
      <button class="danger" onclick="showShutdown()">서버 종료</button>
    </div>
    <div class="capture-input">
      <label>점령 시간 (초):</label>
      <input type="number" id="capture-sec" value="3600" min="60" max="86400">
      <button onclick="setCaptureTime()">적용</button>
    </div>
  </div>
</main>

<!-- 종료 확인 모달 -->
<div class="confirm-overlay" id="shutdown-modal">
  <div class="confirm-box">
    <h3>서버 종료</h3>
    <p>정말 서버를 종료하시겠습니까?<br>진행 중인 게임 데이터가 저장됩니다.</p>
    <div class="btn-row">
      <button class="danger" onclick="doShutdown()">종료</button>
      <button onclick="hideShutdown()">취소</button>
    </div>
  </div>
</div>

<script>
let lastData = null;

function fmtTime(s) {
  if (s < 0) s = 0;
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return [h, m, sec].map(v => String(v).padStart(2, '0')).join(':');
}

function fmtShort(s) {
  if (s >= 3600) return Math.floor(s/3600) + '시간 ' + Math.floor((s%3600)/60) + '분';
  if (s >= 60)   return Math.floor(s/60) + '분 ' + (s%60) + '초';
  return s + '초';
}

function pingClass(ms) {
  if (ms < 80)  return 'ping-good';
  if (ms < 200) return 'ping-mid';
  return 'ping-bad';
}

function hpColor(pct) {
  if (pct > 0.6) return '#3fb950';
  if (pct > 0.3) return '#d29922';
  return '#f85149';
}

function teamColor(teamId) {
  const map = { '빨강':'#f85149','파랑':'#58a6ff','초록':'#3fb950','노랑':'#d29922','주황':'#fb8f44' };
  return map[teamId] || '#8b949e';
}

async function fetchStatus() {
  try {
    const r = await fetch('/api/status');
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    render(data);
    setOnline(true);
    clearError();
  } catch (e) {
    setOnline(false);
    showError('서버 연결 실패: ' + e.message);
  }
}

function showError(msg) {
  const bar = document.getElementById('error-bar');
  bar.textContent = '⚠ ' + msg;
  bar.style.display = 'block';
}
function clearError() {
  document.getElementById('error-bar').style.display = 'none';
}

function setOnline(ok) {
  const dot = document.getElementById('status-dot');
  const lbl = document.getElementById('status-label');
  dot.className = ok ? '' : 'offline';
  lbl.textContent = ok ? '서버 연결됨' : '서버 오프라인';
}

function render(d) {
  lastData = d;

  // 타이머
  document.getElementById('timer-display').textContent = fmtTime(d.remaining ?? 0);
  document.getElementById('elapsed').textContent = fmtShort(d.elapsed ?? 0);
  document.getElementById('remaining').textContent = fmtShort(d.remaining ?? 0);
  const badge = document.getElementById('phase-badge');
  if (!d.running) {
    badge.textContent = '게임 없음'; badge.className = 'badge-prep';
  } else if (d.capturePhase) {
    badge.textContent = '⚔ 점령 가능'; badge.className = 'badge-capture';
  } else {
    badge.textContent = '준비 단계'; badge.className = 'badge-prep';
  }

  // 접속자
  const ul = document.getElementById('player-list');
  document.getElementById('player-count').textContent = '(' + d.playerCount + ')';
  if (!d.players || d.players.length === 0) {
    ul.innerHTML = '<li id="no-players" style="color:#8b949e;font-size:.85rem">접속자 없음</li>';
  } else {
    ul.innerHTML = d.players.map(p => `
      <li>
        <span>${p.name} <span class="player-team">${p.team}</span></span>
        <span class="${pingClass(p.ping)}">${p.ping}ms</span>
      </li>`).join('');
  }

  // 팀
  const tl = document.getElementById('team-list');
  if (!d.teams || d.teams.length === 0) {
    tl.innerHTML = '<span style="color:#8b949e;font-size:.85rem">팀 없음</span>';
  } else {
    tl.innerHTML = d.teams.map(t => `
      <div class="team-row">
        <span class="team-name" style="color:${teamColor(t.id)}">${t.id}</span>
        <span class="team-stat">멤버 ${t.members}명 · 깃발 ${t.flags}개</span>
        <span class="gold-val">💰 ${t.gold}G</span>
      </div>`).join('');
  }

  // 깃발
  const fl = document.getElementById('flag-list');
  if (!d.flags || d.flags.length === 0) {
    fl.innerHTML = '<span style="color:#8b949e;font-size:.85rem">깃발 없음</span>';
  } else {
    fl.innerHTML = d.flags.map(f => {
      const pct = f.maxHp > 0 ? f.hp / f.maxHp : 0;
      const owner = f.team === 'neutral' ? '중립' : f.team;
      return `
      <div class="flag-row">
        <div class="flag-header">
          <span>깃발 #${f.id} <span style="color:${teamColor(f.team)}">${owner}</span></span>
          <span style="color:#8b949e;font-size:.75rem">${f.hp}/${f.maxHp}</span>
        </div>
        <div class="flag-hp-bar">
          <div class="flag-hp-fill" style="width:${(pct*100).toFixed(1)}%;background:${hpColor(pct)}"></div>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('refresh-label').textContent = '업데이트: ' + new Date().toLocaleTimeString('ko');
}

async function setCapture(on) {
  await fetch('/api/capture', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({on}) });
  fetchStatus();
}

async function timerAction(action) {
  await fetch('/api/timer/set', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({action}) });
  fetchStatus();
}

async function setCaptureTime() {
  const sec = parseInt(document.getElementById('capture-sec').value, 10);
  if (isNaN(sec) || sec < 60) return alert('60초 이상 입력하세요');
  // config 변경은 RCON 지원 안되므로 안내
  alert(`점령 시간 ${sec}초 설정은 서버 재시작 후 config.yml에서 game.capture-phase-duration-seconds 를 수정하세요.\n현재 세션은 타이머 ON/OFF 버튼으로 제어하세요.`);
}

function showShutdown() { document.getElementById('shutdown-modal').classList.add('show'); }
function hideShutdown() { document.getElementById('shutdown-modal').classList.remove('show'); }
async function doShutdown() {
  hideShutdown();
  await fetch('/api/shutdown', { method: 'POST' });
  setOnline(false);
}

// 3초마다 폴링
fetchStatus();
setInterval(fetchStatus, 3000);
</script>
</body>
</html>
